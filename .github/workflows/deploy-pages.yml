name: Deploy Workout to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check dependency security
        run: npm run audit:security
      - name: Check application types
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Check coding rules
        run: npm run lint
      - name: Run isolated tests
        run: npm run test
      - name: Build GitHub Pages
        env:
          VITE_PREVIEW_MODE: "false"
          VITE_DEPLOY_TARGET: "github-pages"
        run: |
          set -a
          source .github/workout-backend.env
          set +a
          npm run build -- --base="${{ vars.PAGES_BASE_PATH || '/echo-site-clone-94/' }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

